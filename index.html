<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>gearcalc</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script type="module" src="js/ui.js"></script>
</head>
<body>
  <canvas id="llenc" aria-label="Pinyó i roda engranant"></canvas>

  <div class="barra" role="toolbar" aria-label="Controls de vista">
    <button id="btn-calaix" class="boto-flotant" aria-controls="calaix" aria-expanded="false" title="Dades">☰</button>
    <button id="btn-animar" class="boto-flotant" title="Girar / aturar">▶</button>
    <button id="btn-engranament" class="boto-flotant" title="Ampliar la zona d'engranament">◎</button>
    <button id="btn-encaixar" class="boto-flotant" title="Veure-ho tot">⤢</button>
    <button id="btn-generacio" class="boto-flotant" aria-pressed="false" title="Generació per la cremallera">✂</button>
  </div>
  <div id="selector-generacio" class="selector-generacio" role="group" aria-label="Roda a generar" hidden>
    <button type="button" data-roda="0" aria-pressed="true">Pinyó</button>
    <button type="button" data-roda="1" aria-pressed="false">Roda</button>
  </div>
  <div id="control-velocitat" class="control-velocitat" hidden>
    <label for="velocitat">Velocitat <output id="velocitat-valor">×0,25</output></label>
    <input id="velocitat" type="range" min="-4.32" max="1" step="any" value="-2" aria-label="Velocitat de l'animació">
    <button id="btn-velocitat-1" class="boto-text" title="Velocitat normal">×1</button>
  </div>
  <div id="estat" class="estat" role="status"></div>

  <aside id="calaix" class="calaix" aria-hidden="true">
    <header class="calaix-capcalera">
      <h1>gearcalc</h1>
      <button id="btn-tancar" class="boto-icona" title="Tancar">✕</button>
    </header>

    <section>
      <h2>Parella</h2>
      <div class="graella">
        <label>Dents pinyó z₁<input id="z1" type="number" min="5" step="1" inputmode="numeric"></label>
        <label>Dents roda z₂<input id="z2" type="number" min="5" step="1" inputmode="numeric"></label>
        <label>Mòdul m (mm)<input id="m" type="number" min="0.05" step="0.05" inputmode="decimal"></label>
        <label>Dist. centres a (mm)<input id="a" type="number" min="0" step="0.1" inputmode="decimal"></label>
      </div>
      <p class="nota">a₀ = <span id="a0">–</span> mm <button id="btn-a0" class="boto-text">usa a₀</button></p>
      <label>Perfil de referència ISO 53
        <select id="perfil">
          <option value="A">A — h_fP 1,25 m · ρ_fP 0,38 m</option>
          <option value="B">B — h_fP 1,25 m · ρ_fP 0,30 m</option>
          <option value="C">C — h_fP 1,25 m · ρ_fP 0,25 m</option>
          <option value="D">D — h_fP 1,40 m · ρ_fP 0,39 m</option>
        </select>
      </label>
      <p class="nota">α_P = 20° · h_aP = 1,00 m</p>
    </section>

    <section>
      <h2>Repartiment de desplaçaments</h2>
      <label class="fila-lliscador">
        <span>s_b1 / s_b2 = <output id="relacio-valor">1,000</output></span>
        <input id="relacio" type="range" min="-1" max="1" step="any" value="0">
      </label>
      <div class="extrems">
        <span id="relacio-min">0,5</span>
        <span class="botons">
          <button id="btn-relacio-1" class="boto-text" title="Iguala el gruix a la base de pinyó i roda">s_b1 = s_b2</button>
          <button id="btn-x-iguals" class="boto-text" title="Iguala els desplaçaments de pinyó i roda">x₁ = x₂</button>
        </span>
        <span id="relacio-max">2</span>
      </div>
    </section>

    <section>
      <h2>Avisos</h2>
      <ul id="avisos" class="avisos"></ul>
    </section>

    <section>
      <h2>Resultats</h2>
      <table class="taula" id="taula-parella"></table>
      <table class="taula" id="taula-rodes"></table>
    </section>

    <section>
      <h2>Lliscament específic</h2>
      <div class="grafic"><canvas id="grafic-lliscament"></canvas></div>
    </section>

    <section>
      <h2>Vista</h2>
      <label class="casella"><input type="checkbox" id="veure-primitives" checked> Circumferències primitives de funcionament</label>
      <label class="casella"><input type="checkbox" id="veure-base" checked> Circumferències base</label>
      <label class="casella"><input type="checkbox" id="veure-linia"> Línia d'engranament</label>
    </section>
  </aside>
</body>
</html>
